name: ci
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Test
        run: swift test
      - name: Daemon stays up without the app
        run: ./Scripts/check-daemon.sh
      - name: CLI refuses unlock bypasses
        run: ./Scripts/check-cli.sh
      - name: SwiftFormat
        run: |
          brew install swiftformat
          swiftformat --lint .
      - name: SwiftLint
        run: |
          brew install swiftlint
          swiftlint
  release:
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Package
        run: ./Scripts/package.sh
      - name: Checksum
        run: shasum -a 256 dist/TradeGate.app/Contents/MacOS/TradeGate | tee dist/TradeGate.sha256
